name: cookwise_app
description: Cookwise - AI冰箱拯救者，让剩菜变美味
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.1
  http: ^1.1.0
  sqflite: ^2.3.0
  path: ^1.8.3
  speech_to_text: ^6.3.0
  image_picker: ^1.0.4
  json_annotation: ^4.8.1
  flutter_dotenv: ^5.1.0
  supabase_flutter: ^2.0.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  change_app_name: ^1.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FF7E36"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true
