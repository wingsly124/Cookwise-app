<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <base href="$FLUTTER_BASE_HREF">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">

    <!-- 移动端适配 Meta 标签 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cookwise">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#FF7E36">
    <meta name="description" content="Cookwise - AI冰箱拯救者，让剩菜变美味">

    <!-- iOS Safari 主屏幕图标 -->
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="manifest" href="manifest.json">
    <title>Cookwise - AI冰箱拯救者</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FFFDF9;
        }

        /* 加载动画 */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #FFFDF9;
            z-index: 9999;
        }

        .loading-logo {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            border-radius: 28px;
            background: linear-gradient(135deg, #FF7E36, #FFB74D);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(255, 126, 54, 0.3);
        }

        .loading-logo span {
            font-size: 48px;
        }

        .loading-text {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #FF7E36;
            margin-bottom: 8px;
        }

        .loading-subtext {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            color: #999;
            margin-bottom: 32px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #FFE0B2;
            border-top-color: #FF7E36;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Flutter 默认样式 */
        .flutter-loader {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 加载动画 -->
    <div class="loading-container" id="loading">
        <div class="loading-logo">
            <span>🍳</span>
        </div>
        <div class="loading-text">Cookwise</div>
        <div class="loading-subtext">AI冰箱拯救者</div>
        <div class="spinner"></div>
    </div>

    <script>
        // 加载完成后隐藏 loading
        window.addEventListener('flutter-first-frame', function () {
            var loading = document.getElementById('loading');
            if (loading) {
                loading.style.opacity = '0';
                loading.style.transition = 'opacity 0.3s ease';
                setTimeout(function () {
                    loading.style.display = 'none';
                }, 300);
            }
        });
    </script>

    <script src="flutter_bootstrap.js" async></script>
</body>
</html>
