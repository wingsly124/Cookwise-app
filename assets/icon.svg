<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF7E36;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB74D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- 机器人身体 -->
  <rect x="156" y="176" width="200" height="180" rx="40" fill="white" opacity="0.95"/>

  <!-- 机器人头 -->
  <circle cx="256" cy="140" r="60" fill="white" opacity="0.95"/>

  <!-- 机器人眼睛 -->
  <circle cx="236" cy="132" r="12" fill="#FF7E36"/>
  <circle cx="276" cy="132" r="12" fill="#FF7E36"/>

  <!-- 机器人嘴巴 -->
  <path d="M 236 160 Q 256 175 276 160" stroke="#FF7E36" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- 机器人天线 -->
  <line x1="256" y1="80" x2="256" y2="100" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="70" r="15" fill="#FFE0B2"/>

  <!-- 机器人手臂 -->
  <rect x="126" y="196" width="30" height="80" rx="15" fill="white" opacity="0.9"/>
  <rect x="356" y="196" width="30" height="80" rx="15" fill="white" opacity="0.9"/>

  <!-- 机器人腿 -->
  <rect x="186" y="356" width="40" height="60" rx="20" fill="white" opacity="0.9"/>
  <rect x="286" y="356" width="40" height="60" rx="20" fill="white" opacity="0.9"/>

  <!-- 厨师帽 -->
  <path d="M 216 100 L 216 80 Q 216 60 236 60 L 276 60 Q 296 60 296 80 L 296 100 Z" fill="white"/>
  <rect x="206" y="95" width="100" height="15" rx="7" fill="#FFE0B2"/>

  <!-- 锅铲 -->
  <g transform="translate(356, 120) rotate(45)">
    <rect x="0" y="0" width="15" height="60" rx="7" fill="#8D6E63"/>
    <ellipse cx="7" cy="-15" rx="20" ry="25" fill="#8D6E63"/>
  </g>

  <!-- 文字水印 -->
  <text x="256" y="430" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="white" opacity="0.8">Cookwise</text>
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" opacity="0.6">AI冰箱拯救者</text>
  <text x="256" y="490" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white" opacity="0.5">WG STUDIO</text>
</svg>
